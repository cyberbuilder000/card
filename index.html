<!doctype html>
<html lang="en">
<head>

<title>Michael Mellor · Allied Advanced Systems</title>
<style>
  :root { --ink:#16202a; --muted:#5b6770; --line:#e3e7ea; --bg:#f6f7f8; --card:#fff; --accent:#1f3a52; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom)); }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:36px 28px 28px; box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05); }
  h1 { font-size:28px; line-height:1.15; margin:0 0 6px; font-weight:700; letter-spacing:-.01em; }
  .title { font-size:17px; color:var(--muted); margin:0; }
  .company { font-size:17px; font-weight:600; margin:2px 0 0; }
  hr { border:0; border-top:1px solid var(--line); margin:26px 0 18px; }
  .row { display:flex; align-items:center; gap:14px; padding:14px 4px; text-decoration:none; color:var(--ink);
    border-bottom:1px solid var(--line); -webkit-tap-highlight-color:rgba(0,0,0,.05); }
  .row:last-of-type { border-bottom:0; }
  .row svg { flex:none; width:22px; height:22px; stroke:var(--accent); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .value { display:block; font-size:16px; word-break:break-all; }
  .save { display:block; margin-top:24px; text-align:center; background:var(--accent); color:#fff; text-decoration:none;
    font-size:17px; font-weight:600; padding:16px; border-radius:12px; }
  .save:active { opacity:.85; }
</style>
</head>
